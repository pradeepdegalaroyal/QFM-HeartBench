[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qfmb"
version = "1.0.0"
description = "QFM-HeartBench: quantum feature-map benchmarking (QSVM, VQC, QGPC) for clinical heart-disease classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0",
  "qiskit>=1.2", "qiskit-aer>=0.15", "xgboost>=2.0", "lightgbm>=4.0",
  "statsmodels>=0.14", "matplotlib>=3.7", "threadpoolctl>=3.1", "psutil",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
qfmb = "qfmb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
